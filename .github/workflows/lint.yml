on:
  workflow_call:
    inputs:
      ref:
        description: "The ref of this reusable workflow."
        type: string
        required: true
      apt-packages:
        description:
          "Apt packages needed to install this dist's develop deps, as a string containing a
          whitespace-separated list of packages."
        type: string

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Install extra apt packages
        run: |
          set -e
          set -x

          if [ -n "${{ inputs.apt-packages }}" ]; then
              sudo apt-get update
              # This will turn newlines into spaces.
              packages="$(perl -E 'say join q{ }, split /\s+/, q{${{ inputs.apt-packages }}}')"
              sudo apt-get --yes install $packages
          fi

      - name: Check out Perl project repository
        uses: actions/checkout@v7

      - name: Check out workflow repository
        uses: actions/checkout@v7
        with:
          repository: houseabsolute/workflow-perl-dzil-ci
          ref: ${{ inputs.ref }}
          # We have to use `./` at the beginning of a `uses:` path, so putting it under `.git`
          # ensures that tools like `precious` ignore it.
          path: ./.git/.workflow-perl-dzil-ci

      - name: Set up Perl
        uses: ./.git/.workflow-perl-dzil-ci/.github/actions/set-up-perl
        with:
          perl-version: latest
          cache-prefix: lint
          # perlcritic, perltidy, and podtidy are installed as scripts.
          cache-extra: bin
          cache-key-file: cpanfile

      - name: Install mise
        run: |
          set -e
          set -x

          curl https://mise.run | sh
          mise install
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # perlcritic, perltidy, podchecker, and podtidy are develop deps, so
      # `--with-all` is what pulls them in.
      - name: Install lint tools
        run: |
          cpm install --verbose --show-build-log-on-failure --global --with-all --cpanfile ./cpanfile

      - name: Run precious
        run: mise exec -- precious lint --all
